<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --card:#14171c; --border:#23272f; --text:#ebeef1;
    --muted:#767e8c; --accent:#ff6a2b; --accent2:#35c48c; --danger:#ff5461;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:24px; font-size:15px; line-height:1.4;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  header.app{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  header.app h1{
    font-family:'JetBrains Mono',monospace; font-size:1rem; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; margin:0; display:flex; align-items:center; gap:8px;
  }
  header.app h1 .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  header.app .tagline{ color:var(--muted); font-size:.78rem; }

  .grid{display:grid; grid-template-columns: 380px 1fr; gap:20px;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} body{padding:16px;} }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .card h2{
    font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 14px;
  }

  label{ display:block; font-size:.72rem; color:var(--muted); margin:12px 0 5px; }
  label:first-of-type{ margin-top:0; }
  input, select{
    width:100%; padding:10px 11px; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-size:.9rem; font-family:inherit;
    transition:border-color .15s ease;
  }
  #f-sku{ font-family:'JetBrains Mono',monospace; }
  input:focus, select:focus{ outline:none; border-color:var(--accent); }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  button{
    cursor:pointer; border:none; border-radius:6px; padding:10px 14px;
    font-size:.82rem; font-weight:600; font-family:inherit;
    transition:filter .15s ease, border-color .15s ease;
  }
  .btn-primary{ background:var(--accent); color:#1a0900; width:100%; margin-top:16px; font-weight:700; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn:hover{ border-color:var(--muted); }
  .btn-danger-ghost{ background:transparent; border:1px solid var(--border); color:var(--danger); }
  .btn-danger-ghost:hover{ border-color:var(--danger); }

  .icon-btn{
    width:30px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--border); color:var(--text); font-size:.9rem; border-radius:6px;
  }
  .icon-btn:hover{ border-color:var(--muted); }
  .icon-btn.danger{ color:var(--danger); }
  .icon-btn.danger:hover{ border-color:var(--danger); }

  details.more{ margin-top:16px; border-top:1px dashed var(--border); padding-top:12px; }
  details.more summary{
    cursor:pointer; font-size:.72rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase;
    list-style:none; display:flex; align-items:center; gap:6px;
  }
  details.more summary::-webkit-details-marker{ display:none; }
  details.more summary::before{ content:'+'; font-family:'JetBrains Mono',monospace; color:var(--accent); font-weight:700; }
  details.more[open] summary::before{ content:'−'; }
  details.more .hint{ font-size:.72rem; color:var(--muted); margin:10px 0; }
  .action-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .action-row button{ flex:1; min-width:120px; }

  .toolbar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input, .toolbar select{width:auto; flex:1; min-width:120px;}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th, td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  th{
    color:var(--muted); font-weight:600; font-size:.64rem; text-transform:uppercase;
    letter-spacing:.08em; font-family:'JetBrains Mono',monospace;
  }
  tr:hover td{background:rgba(255,255,255,.02);}
  .item-name{ font-weight:600; }
  .item-sku{ display:block; font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--muted); margin-top:2px; }

  .tag{
    display:inline-flex; align-items:center; font-family:'JetBrains Mono',monospace;
    font-size:.76rem; border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:4px; padding:3px 8px; background:rgba(255,106,43,.06); white-space:nowrap;
  }

  .qty-cell{ display:flex; align-items:center; gap:6px; }
  .qty-cell .icon-btn{ width:26px; height:26px; font-size:.85rem; }
  .qty-input{ width:52px; padding:5px 4px; font-family:'JetBrains Mono',monospace; font-weight:700; text-align:center; color:var(--accent2); }

  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }

  .empty{ text-align:center; color:var(--muted); padding:40px 0; font-size:.85rem; }

  .stats{ display:flex; margin-bottom:18px; border-top:1px dashed var(--border); border-bottom:1px dashed var(--border); }
  .stat{ flex:1; padding:12px 4px; text-align:center; border-left:1px dashed var(--border); }
  .stat:first-child{ border-left:none; }
  .stat .num{ font-family:'JetBrains Mono',monospace; font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .lbl{ font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }

  .base-status{ font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--muted); margin:6px 0 0; }
  .base-status.on{ color:var(--accent2); }

  #toast{
    position:fixed; bottom:20px; right:20px; background:var(--card); border:1px solid var(--accent2); color:var(--text);
    padding:10px 16px; border-radius:6px; font-size:.82rem; display:none; z-index:99;
    box-shadow:0 8px 24px rgba(0,0,0,.4); font-family:'JetBrains Mono',monospace;
  }
  #fileInput{display:none;}

  .sugestoes-box{
    position:relative; margin-top:4px; max-height:220px; overflow-y:auto;
    border:1px solid var(--border); border-radius:6px; background:var(--bg);
  }
  .sugestao-item{ padding:9px 10px; font-size:.78rem; cursor:pointer; border-bottom:1px solid var(--border); display:flex; gap:8px; }
  .sugestao-item:last-child{border-bottom:none;}
  .sugestao-item:hover{background:rgba(255,255,255,.03);}
  .sugestao-item b{ color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:.76rem; flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="app">
  <h1><span class="dot"></span>Estoque</h1>
  <div class="tagline">Estante / Prateleira — contagem e catalogação</div>
</header>

<div class="grid">

  <!-- FORM -->
  <div class="card">
    <h2>Adicionar item</h2>

    <label>Código (bipar ou digitar)</label>
    <input id="f-sku" placeholder="Código, SKU ou parte do nome" oninput="handleBuscaSku()" autocomplete="off">
    <div id="sugestoes" class="sugestoes-box" style="display:none;"></div>
    <div id="baseStatus" class="base-status"></div>

    <label>Nome do item</label>
    <input id="f-nome" placeholder="Ex: Parafuso M6" list="lista-nomes" oninput="handleBuscaNome()" autocomplete="off">
    <datalist id="lista-nomes"></datalist>

    <div class="row2">
      <div>
        <label>Estante</label>
        <input id="f-estante" placeholder="A1">
      </div>
      <div>
        <label>Prateleira</label>
        <input id="f-prateleira" placeholder="3">
      </div>
    </div>

    <label>Quantidade</label>
    <input id="f-qtd" type="number" min="1" value="1" class="mono">

    <button class="btn-primary" onclick="addItem()">Adicionar / somar</button>

    <details class="more">
      <summary>Backup e relatórios</summary>
      <div class="action-row">
        <button class="btn" onclick="document.getElementById('fileInput').click()">Importar</button>
        <button class="btn" onclick="exportJSON()">Backup JSON</button>
      </div>
      <div class="action-row">
        <button class="btn" onclick="exportarPDF()">Exportar PDF</button>
        <button class="btn" onclick="exportarWord()">Exportar Word</button>
      </div>
      <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    </details>

    <details class="more">
      <summary>Base de produtos (XLSX)</summary>
      <div class="hint">Colunas: Código Produto, Código Auxiliar, Descrição Completa.</div>
      <div class="action-row">
        <button class="btn" onclick="document.getElementById('baseInput').click()">Carregar planilha</button>
        <button class="btn btn-danger-ghost" onclick="limparBase()">Limpar base</button>
      </div>
      <input type="file" id="baseInput" accept=".xlsx,.xls" style="display:none;" onchange="importarBaseXLSX(event)">
    </details>
  </div>

  <!-- LISTA -->
  <div class="card">
    <h2>Estoque</h2>

    <div class="stats">
      <div class="stat"><div class="num" id="st-itens">0</div><div class="lbl">Itens</div></div>
      <div class="stat"><div class="num" id="st-qtd">0</div><div class="lbl">Peças</div></div>
      <div class="stat"><div class="num" id="st-enderecos">0</div><div class="lbl">Endereços</div></div>
    </div>

    <div class="toolbar">
      <input id="busca" placeholder="Buscar item, código ou endereço" oninput="render()">
      <select id="ordenar" onchange="render()">
        <option value="nome">Nome</option>
        <option value="qtd-desc">Qtd ↓</option>
        <option value="qtd-asc">Qtd ↑</option>
        <option value="endereco">Endereço</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Endereço</th>
          <th>Qtd</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyMsg" class="empty" style="display:none;">Nenhum item cadastrado ainda.</div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'estoque_dados_v1';
let dados = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

function salvar(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
  render();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.style.display='none', 2000);
}

function chaveItem(nome, estante, prateleira){
  return (nome.trim().toLowerCase() + '|' + estante.trim().toLowerCase() + '|' + prateleira.trim().toLowerCase());
}

const BASE_KEY = 'estoque_base_xlsx_v1';
let baseItens = JSON.parse(localStorage.getItem(BASE_KEY) || '[]');
atualizarBaseStatus();

function normalizarCabecalho(h){
  return String(h).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // remove acentos
}

function importarBaseXLSX(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const linhas = XLSX.utils.sheet_to_json(sheet, { defval: '' });

      if(linhas.length === 0){
        alert('Planilha vazia.');
        return;
      }

      const colunas = Object.keys(linhas[0]);
      const acharColuna = (opcoes) => colunas.find(c => opcoes.includes(normalizarCabecalho(c)));

      const colCodProduto = acharColuna(['codigo produto','codigo','sku','cod']);
      const colCodAuxiliar = acharColuna(['codigo auxiliar','cod auxiliar','codigo aux']);
      const colNome = acharColuna(['descricao completa','descricao','nome','item','produto']);

      if(!colCodProduto || !colNome){
        alert('Não encontrei as colunas necessárias na planilha.\nEsperado: "Código Produto" e "Descrição Completa" (ou variações).\nColunas encontradas: ' + colunas.join(', '));
        return;
      }

      const normalizarBlank = v => (v.toLowerCase() === '(blank)' ? '' : v);

      baseItens = linhas
        .map(l => ({
          codProduto: normalizarBlank(String(l[colCodProduto]).trim()),
          codAuxiliar: colCodAuxiliar ? normalizarBlank(String(l[colCodAuxiliar]).trim()) : '',
          nome: String(l[colNome]).trim()
        }))
        .filter(l => (l.codProduto || l.codAuxiliar) && l.nome);

      localStorage.setItem(BASE_KEY, JSON.stringify(baseItens));
      atualizarBaseStatus();
      toast(`Base carregada: ${baseItens.length} itens`);
    }catch(err){
      alert('Erro ao ler a planilha. Confirme se é um .xlsx/.xls válido.');
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
}

function limparBase(){
  if(baseItens.length === 0) return;
  if(!confirm('Remover a base de dados carregada? (não afeta os itens já cadastrados no estoque)')) return;
  baseItens = [];
  localStorage.removeItem(BASE_KEY);
  atualizarBaseStatus();
  toast('Base removida');
}

function atualizarBaseStatus(){
  const el = document.getElementById('baseStatus');
  if(baseItens.length > 0){
    el.textContent = `● base ativa — ${baseItens.length} itens`;
    el.classList.add('on');
  } else {
    el.textContent = '○ nenhuma base carregada';
    el.classList.remove('on');
  }
}

function normalizarTexto(v){
  return String(v || '').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

let sugestoesAtuais = [];

function buscarNaBase(query){
  const q = normalizarTexto(query);
  if(!q || q.length < 2 || baseItens.length === 0) return [];
  return baseItens.filter(b => {
    const cp = normalizarTexto(b.codProduto);
    const ca = normalizarTexto(b.codAuxiliar);
    const nome = normalizarTexto(b.nome);
    return cp.includes(q) || ca.includes(q) || nome.includes(q);
  }).slice(0, 8);
}

function renderSugestoes(lista){
  sugestoesAtuais = lista;
  const box = document.getElementById('sugestoes');
  if(lista.length === 0){
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.innerHTML = lista.map((b, i) => `
    <div class="sugestao-item" onclick="selecionarSugestao(${i})">
      <b>${escapeHtml(b.codProduto || b.codAuxiliar)}</b> — ${escapeHtml(b.nome)}
    </div>
  `).join('');
  box.style.display = 'block';
}

function selecionarSugestao(i){
  const b = sugestoesAtuais[i];
  if(!b) return;
  document.getElementById('f-sku').value = b.codProduto || b.codAuxiliar;
  document.getElementById('f-nome').value = b.nome;
  document.getElementById('sugestoes').style.display = 'none';
  document.getElementById('f-estante').focus();
}

function handleBuscaSku(){
  const valor = document.getElementById('f-sku').value.trim();

  // se bater exato com um código (leitor de código de barras), preenche na hora
  const exato = baseItens.find(b => b.codProduto === valor || b.codAuxiliar === valor);
  if(exato){
    document.getElementById('f-nome').value = exato.nome;
    document.getElementById('sugestoes').style.display = 'none';
    return;
  }

  renderSugestoes(buscarNaBase(valor));
}

function handleBuscaNome(){
  const valor = document.getElementById('f-nome').value.trim();
  renderSugestoes(buscarNaBase(valor));
}

// esconde sugestões ao clicar fora
document.addEventListener('click', (e) => {
  const box = document.getElementById('sugestoes');
  if(!box) return;
  if(!box.contains(e.target) && e.target.id !== 'f-sku' && e.target.id !== 'f-nome'){
    box.style.display = 'none';
  }
});

function addItem(){
  const nome = document.getElementById('f-nome').value.trim();
  const estante = document.getElementById('f-estante').value.trim();
  const prateleira = document.getElementById('f-prateleira').value.trim();
  const qtd = parseInt(document.getElementById('f-qtd').value) || 0;
  const sku = document.getElementById('f-sku').value.trim();

  if(!nome || !estante || !prateleira || qtd <= 0){
    toast('Preencha nome, estante, prateleira e quantidade > 0');
    return;
  }

  const chave = chaveItem(nome, estante, prateleira);
  const existente = dados.find(i => chaveItem(i.nome, i.estante, i.prateleira) === chave);

  if(existente){
    existente.qtd += qtd;
    if(sku) existente.sku = sku;
    toast(`+${qtd} somado a "${nome}" (${estante}/${prateleira}). Total: ${existente.qtd}`);
  } else {
    // checa se o mesmo item já existe em OUTRO endereço
    const nomeNorm = nome.trim().toLowerCase();
    const outrosLocais = dados.filter(i => i.nome.trim().toLowerCase() === nomeNorm);

    if(outrosLocais.length > 0){
      const lista = outrosLocais.map(i => `• ${i.estante}/${i.prateleira} (qtd: ${i.qtd})`).join('\n');
      const confirmar = confirm(
        `"${nome}" já está cadastrado em outro(s) endereço(s):\n\n${lista}\n\n` +
        `Deseja mesmo cadastrar um NOVO local (${estante}/${prateleira}) para este item?`
      );
      if(!confirmar){
        toast('Cadastro cancelado');
        return;
      }
    }

    dados.push({
      id: Date.now() + Math.random().toString(16).slice(2),
      nome, estante, prateleira, qtd, sku
    });
    toast(`"${nome}" cadastrado em ${estante}/${prateleira}`);
  }

  document.getElementById('f-nome').value = '';
  document.getElementById('f-estante').value = '';
  document.getElementById('f-prateleira').value = '';
  document.getElementById('f-qtd').value = '1';
  document.getElementById('f-sku').value = '';
  document.getElementById('f-nome').focus();

  salvar();
}

function ajustarQtd(id, delta){
  const item = dados.find(i => i.id === id);
  if(!item) return;
  item.qtd += delta;
  if(item.qtd <= 0){
    if(confirm(`Quantidade zerada. Remover "${item.nome}" do endereço ${item.estante}/${item.prateleira}?`)){
      dados = dados.filter(i => i.id !== id);
    } else {
      item.qtd = 0;
    }
  }
  salvar();
}

function editarQtdDireta(id, valor){
  const item = dados.find(i => i.id === id);
  if(!item) return;
  const v = parseInt(valor);
  if(isNaN(v) || v < 0) return;
  item.qtd = v;
  salvar();
}

function editarItem(id){
  const item = dados.find(i => i.id === id);
  if(!item) return;

  const novoNome = prompt('Nome do item:', item.nome);
  if(novoNome === null) return; // cancelou
  const novoSku = prompt('Código / SKU:', item.sku || '');
  if(novoSku === null) return;
  const novaEstante = prompt('Estante:', item.estante);
  if(novaEstante === null) return;
  const novaPrateleira = prompt('Prateleira:', item.prateleira);
  if(novaPrateleira === null) return;
  const novaQtdStr = prompt('Quantidade:', item.qtd);
  if(novaQtdStr === null) return;

  const nomeT = novoNome.trim();
  const skuT = novoSku.trim();
  const estanteT = novaEstante.trim();
  const prateleiraT = novaPrateleira.trim();
  const qtdT = parseInt(novaQtdStr);

  if(!nomeT || !estanteT || !prateleiraT || isNaN(qtdT) || qtdT < 0){
    toast('Dados inválidos. Nenhuma alteração foi salva.');
    return;
  }

  const chaveNova = chaveItem(nomeT, estanteT, prateleiraT);
  const chaveAtual = chaveItem(item.nome, item.estante, item.prateleira);

  // se nome/endereço mudou pra combinação que já existe em outro registro, oferece fundir
  if(chaveNova !== chaveAtual){
    const destino = dados.find(i => i.id !== id && chaveItem(i.nome, i.estante, i.prateleira) === chaveNova);
    if(destino){
      const fundir = confirm(
        `Já existe "${nomeT}" em ${estanteT}/${prateleiraT} (qtd: ${destino.qtd}).\n\n` +
        `Deseja somar a quantidade (${qtdT}) a esse local e remover este registro?`
      );
      if(!fundir) return;
      destino.qtd += qtdT;
      if(skuT) destino.sku = skuT;
      dados = dados.filter(i => i.id !== id);
      toast(`Quantidades somadas em ${estanteT}/${prateleiraT}`);
      salvar();
      return;
    }
  }

  item.nome = nomeT;
  item.sku = skuT;
  item.estante = estanteT;
  item.prateleira = prateleiraT;
  item.qtd = qtdT;
  toast('Item atualizado');
  salvar();
}

function removerItem(id){
  const item = dados.find(i => i.id === id);
  if(!item) return;
  if(confirm(`Remover "${item.nome}" (${item.estante}/${item.prateleira}) do estoque?`)){
    dados = dados.filter(i => i.id !== id);
    salvar();
  }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(dados, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `estoque_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado');
}

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const novo = JSON.parse(e.target.result);
      if(!Array.isArray(novo)) throw new Error();
      if(dados.length > 0 && !confirm('Isso vai SUBSTITUIR os dados atuais pelos do arquivo. Continuar?')) return;
      dados = novo;
      salvar();
      toast('Dados importados com sucesso');
    }catch(err){
      alert('Arquivo inválido.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function gerarHTMLRelatorio(){
  const lista = [...dados].sort((a,b)=> (a.estante+a.prateleira+a.nome).localeCompare(b.estante+b.prateleira+b.nome));
  const dataStr = new Date().toLocaleString('pt-BR');
  const totalPecas = lista.reduce((s,i)=> s + i.qtd, 0);
  const enderecos = new Set(lista.map(i => i.estante.toLowerCase()+'/'+i.prateleira.toLowerCase()));

  const linhas = lista.map(i => `
    <tr>
      <td>${escapeHtml(i.estante)}</td>
      <td>${escapeHtml(i.prateleira)}</td>
      <td>${escapeHtml(i.nome)}</td>
      <td>${escapeHtml(i.sku||'-')}</td>
      <td style="text-align:center;"><b>${i.qtd}</b></td>
    </tr>
  `).join('');

  return `
  <html>
  <head>
  <meta charset="UTF-8">
  <title>Relatório de Estoque</title>
  <style>
    body{ font-family: Arial, sans-serif; color:#111; padding:30px; }
    h1{ font-size:20px; margin-bottom:2px; }
    .meta{ color:#555; font-size:12px; margin-bottom:18px; }
    .resumo{ display:flex; gap:20px; margin-bottom:20px; }
    .resumo div{ border:1px solid #ccc; border-radius:6px; padding:8px 14px; font-size:12px; }
    .resumo b{ display:block; font-size:16px; }
    table{ width:100%; border-collapse:collapse; font-size:12px; }
    th, td{ border:1px solid #ccc; padding:6px 8px; text-align:left; }
    th{ background:#f0f0f0; }
  </style>
  </head>
  <body>
    <h1>Relatório de Estoque</h1>
    <div class="meta">Gerado em ${dataStr}</div>
    <div class="resumo">
      <div><b>${lista.length}</b>Itens distintos</div>
      <div><b>${totalPecas}</b>Peças no total</div>
      <div><b>${enderecos.size}</b>Endereços ocupados</div>
    </div>
    <table>
      <thead>
        <tr><th>Estante</th><th>Prateleira</th><th>Item</th><th>SKU</th><th>Qtd</th></tr>
      </thead>
      <tbody>${linhas || '<tr><td colspan="5">Nenhum item cadastrado</td></tr>'}</tbody>
    </table>
  </body>
  </html>`;
}

function exportarPDF(){
  const html = gerarHTMLRelatorio();
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  // dá tempo do navegador renderizar antes de abrir o diálogo de impressão
  setTimeout(()=> win.print(), 300);
}

function exportarWord(){
  const html = gerarHTMLRelatorio();
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relatorio_estoque_${new Date().toISOString().slice(0,10)}.doc`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Relatório Word exportado');
}

function render(){
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const ordem = document.getElementById('ordenar').value;
  const tbody = document.getElementById('tbody');
  const emptyMsg = document.getElementById('emptyMsg');

  let lista = dados.filter(i =>
    !busca ||
    i.nome.toLowerCase().includes(busca) ||
    (i.sku||'').toLowerCase().includes(busca) ||
    i.estante.toLowerCase().includes(busca) ||
    i.prateleira.toLowerCase().includes(busca)
  );

  if(ordem === 'nome') lista.sort((a,b)=> a.nome.localeCompare(b.nome));
  if(ordem === 'qtd-desc') lista.sort((a,b)=> b.qtd - a.qtd);
  if(ordem === 'qtd-asc') lista.sort((a,b)=> a.qtd - b.qtd);
  if(ordem === 'endereco') lista.sort((a,b)=> (a.estante+a.prateleira).localeCompare(b.estante+b.prateleira));

  tbody.innerHTML = '';
  emptyMsg.style.display = lista.length === 0 ? 'block' : 'none';

  lista.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="item-name">${escapeHtml(item.nome)}</div>
        ${item.sku ? `<span class="item-sku">${escapeHtml(item.sku)}</span>` : ''}
      </td>
      <td><span class="tag">${escapeHtml(item.estante)}/${escapeHtml(item.prateleira)}</span></td>
      <td>
        <div class="qty-cell">
          <button class="icon-btn" onclick="ajustarQtd('${item.id}', -1)" title="Diminuir">−</button>
          <input class="qty-input" type="number" value="${item.qtd}" onchange="editarQtdDireta('${item.id}', this.value)">
          <button class="icon-btn" onclick="ajustarQtd('${item.id}', 1)" title="Aumentar">+</button>
        </div>
      </td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" onclick="editarItem('${item.id}')" title="Editar item">✎</button>
          <button class="icon-btn danger" onclick="removerItem('${item.id}')" title="Remover">✕</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // stats
  document.getElementById('st-itens').textContent = dados.length;
  document.getElementById('st-qtd').textContent = dados.reduce((s,i)=> s + i.qtd, 0);
  const enderecos = new Set(dados.map(i => i.estante.toLowerCase()+'/'+i.prateleira.toLowerCase()));
  document.getElementById('st-enderecos').textContent = enderecos.size;

  // datalist de nomes para autocomplete
  const dl = document.getElementById('lista-nomes');
  dl.innerHTML = '';
  const nomesUnicos = [...new Set(dados.map(i=>i.nome))];
  nomesUnicos.forEach(n=>{
    const opt = document.createElement('option');
    opt.value = n;
    dl.appendChild(opt);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

render();
</script>
